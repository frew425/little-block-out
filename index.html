<style>

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
:root{
  /* layout: one-screen play surface; a wooden tray centered in the room, parent controls tucked quietly into the top corners */
  --wood:#E4D3B4;
  --wood-hi:#EEE1C8;
  --tray:#C9B28A;
  --well:#D6C29E;
  --ink:#6B5840;
  --ink-soft:#9C8767;
  --dot:#CDB993;
  --dot-on:#7A6448;
  --panel:#F3EAD8;
  --walnut:#7A5C3A;
  --cream:#F6EBD6;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Quicksand",system-ui,sans-serif;
  --num:"Fredoka",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;box-sizing:border-box;overflow:hidden;
  background:radial-gradient(ellipse 90% 70% at 50% 42%,var(--wood-hi),var(--wood));
  background-color:var(--wood);
  color:var(--ink);font-family:var(--font);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{height:100%;display:flex;flex-direction:column}
.bar{height:92px;flex:none;display:grid;grid-template-columns:96px 1fr 96px;align-items:center}
.lvl{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 10px;cursor:default;transition:transform .3s}
.lvl.pressing{transform:scale(.92)}
.lvnum{font-family:var(--num);font-weight:600;font-size:30px;line-height:1;color:var(--ink);min-width:48px;height:42px;padding:0 12px;box-sizing:border-box;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--well);box-shadow:inset 0 2px 4px rgba(90,62,28,.2),0 1px 0 rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
.lvnum.pop{animation:lvpop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes lvpop{35%{transform:scale(1.35)}}
.holdtip{font-size:11px;letter-spacing:.06em;color:var(--ink-soft);opacity:.75;line-height:1}
.side{display:flex;align-items:center;gap:4px}
.side.r{justify-content:flex-end}
.icon{width:44px;height:44px;border:0;background:none;padding:10px;color:var(--ink-soft);opacity:.55;border-radius:12px;cursor:pointer;flex:none}
.icon:focus-visible{outline:2px solid var(--ink-soft);opacity:1}
.icon svg{width:24px;height:24px;display:block}
.mathbtn{font-family:var(--num);font-weight:600;font-size:15px;padding:0;letter-spacing:.02em;transition:background .25s,color .25s,opacity .25s}
.mathbtn.on{opacity:1;color:var(--cream);background:var(--walnut)}
.dots{display:flex;justify-content:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dot);transition:background .4s,transform .4s}
.dot.on{background:var(--dot-on)}
.dot.now{box-shadow:0 0 0 2px var(--wood),0 0 0 3.5px var(--dot-on)}
.dot.pop{animation:pop .6s ease-out}
@keyframes pop{40%{transform:scale(1.8)}}
#stage{flex:1;position:relative;min-height:0}
#tray{position:absolute;background:var(--tray);box-shadow:inset 0 3px 8px rgba(90,62,28,.28),0 1px 0 rgba(255,255,255,.55),0 10px 30px rgba(110,80,40,.14)}
.well{position:absolute;background:var(--well);box-shadow:inset 0 2px 4px rgba(90,62,28,.2)}
.gate{position:absolute;box-shadow:inset 0 -2px 0 rgba(0,0,0,.14),0 1px 0 rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;gap:5px}
.gate.v{flex-direction:column}
.gate b{font-family:var(--num);font-weight:600;color:var(--gi,var(--cream));line-height:1}
.gate i{display:block;border-radius:50%;background:var(--gi,var(--cream));opacity:.85}
.gate .gd{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;align-items:center}
.gate.v .gd{flex-direction:column}
.block{position:absolute;cursor:grab;touch-action:none;transition:scale .15s ease-out,left .1s ease-out,top .1s ease-out;
  background:linear-gradient(180deg,var(--l) 0%,var(--f) 38%,var(--f) 100%);
  box-shadow:0 4px 0 var(--d),0 8px 14px rgba(80,55,20,.2),inset 0 1px 0 rgba(255,255,255,.4)}
.block.held{scale:1.05}
.knob{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 36% 30%,var(--kl,var(--l)) 0%,var(--kf,var(--f)) 45%,var(--kd,var(--d)) 100%);
  box-shadow:0 3px 3px rgba(60,40,15,.28),0 0 0 1px rgba(0,0,0,.05)}
.eq{position:absolute;z-index:5;pointer-events:none;white-space:nowrap;font-family:var(--num);font-weight:600;color:var(--ink);
  background:#FBF5EA;border-radius:999px;box-shadow:0 6px 16px rgba(80,55,20,.18),0 0 0 1px rgba(120,90,50,.12)}
.cheer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;pointer-events:none}
.cheer i{border-radius:50%;display:block;animation:hop .7s cubic-bezier(.3,.7,.4,1) 2 alternate both;
  background:radial-gradient(circle at 36% 30%,var(--l) 0%,var(--f) 45%,var(--d) 100%);box-shadow:0 6px 8px rgba(60,40,15,.25)}
@keyframes hop{0%{transform:translateY(30px) scale(.3);opacity:0}60%{opacity:1}100%{transform:translateY(-26px) scale(1);opacity:1}}
.panel{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(80,60,35,.25);padding:24px}
.card{background:var(--panel);border-radius:22px;padding:22px 20px;width:100%;max-width:340px;box-sizing:border-box;box-shadow:0 20px 50px rgba(60,40,15,.25);display:flex;flex-direction:column;gap:18px;max-height:100%;overflow:auto}
.card h2{margin:0;font-family:var(--num);font-weight:600;font-size:20px;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:8px}
.field.inline{flex-direction:row;align-items:center;justify-content:space-between}
.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.card button{font:inherit;font-size:15px;border:0;border-radius:999px;padding:11px 18px;cursor:pointer;background:var(--well);color:var(--ink)}
.card button.go{background:var(--ink);color:var(--panel)}
.card button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--well);border-radius:999px;padding:4px;gap:4px}
.card .seg button{padding:9px 10px;background:none}
.card .seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 3px rgba(80,55,20,.2);font-weight:600}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .stepper button{width:52px;height:52px;padding:0;font-size:26px;line-height:1;font-family:var(--num)}
.stepper output{font-family:var(--num);font-weight:600;font-size:38px;color:var(--ink);font-variant-numeric:tabular-nums}
.hint{margin:0;text-align:center;font-size:13px;color:var(--ink-soft)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card .chips button{padding:8px 0;font-size:14px;font-family:var(--num);font-variant-numeric:tabular-nums}
.card .chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.card .switch{width:54px;height:32px;padding:3px;border-radius:999px;background:var(--dot);position:relative;transition:background .2s}
.switch span{display:block;width:26px;height:26px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(60,40,15,.3);transition:transform .2s}
.card .switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"] span{transform:translateX(22px)}
.card .row{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
@media (prefers-reduced-motion:reduce){.cheer i{animation-duration:.01s}.dot.pop{animation:none}}
</style>

<div class="panel" id="panel" hidden>
  <div class="card" role="dialog" aria-label="Parent settings">

      <span class="lab">Game</span>

<script>
(()=>{
const COLORS=[
  {f:'#C8704E',d:'#9D4E31',l:'#E29676'},
  {f:'#7FA27A',d:'#5A7D56',l:'#A6C4A0'},
  {f:'#DCA93B',d:'#B0821E',l:'#F0CA6E'},
  {f:'#6E93B4',d:'#4D7091',l:'#98B7D2'}
];
const MAPLE={f:'#C9AB7E',d:'#9C7E53',l:'#E2CBA3'};
/* Montessori bead-stair colors, softened to sit with the wood: 1 red, 2 green, 3 pink, 4 yellow, 5 light blue, 6 lavender, 7 white, 8 brown, 9 dark blue, 10 gold */
const NUMC=[null,
  {f:'#C65A4E',d:'#983F35',l:'#DE8478'},
  {f:'#7FA27A',d:'#5A7D56',l:'#A6C4A0'},
  {f:'#D98CA0',d:'#AE6679',l:'#EDB2C1'},
  {f:'#E2BE48',d:'#B5922A',l:'#F2D67C'},
  {f:'#7FB0CF',d:'#5A8CAD',l:'#A9CCE3'},
  {f:'#9D8AC0',d:'#77649C',l:'#BFB2D9'},
  {f:'#EFE5D3',d:'#C6B699',l:'#FCF8EF'},
  {f:'#9A6B45',d:'#714D2E',l:'#BD9068'},
  {f:'#4F6F9A',d:'#384F73',l:'#7A98BF'},
  {f:'#BF8E3A',d:'#946A22',l:'#DDB46A'}
];
const numColor=v=>NUMC[Math.min(Math.max(v,1),10)];
const CREAM={f:'#F3E8D3',d:'#CDBB9C',l:'#FFFBF2'};
const WALNUT={f:'#6E5134',d:'#4E3822',l:'#93734F'};
const LEVELS=[null,
  {W:3,H:3,k:2,n:2, long:0,  frac:1,   minR:1},
  {W:3,H:3,k:2,n:3, long:0,  frac:1,   minR:1},
  {W:3,H:4,k:2,n:4, long:0,  frac:.67, minR:2},
  {W:4,H:4,k:3,n:5, long:.2, frac:.6,  minR:2},
  {W:4,H:4,k:3,n:6, long:.3, frac:.5,  minR:2},
  {W:4,H:5,k:3,n:7, long:.3, frac:.5,  minR:2},
  {W:4,H:5,k:4,n:8, long:.35,frac:.5,  minR:3},
  {W:5,H:5,k:4,n:9, long:.4, frac:.4,  minR:3},
  {W:5,H:6,k:4,n:10,long:.4, frac:.4,  minR:3},
  {W:5,H:6,k:4,n:12,long:.45,frac:.4,  minR:3}
];
/* adding mode: build each gate's number by snapping knob blocks together */
const MLEVELS=[null,
  {W:3,H:3,nT:2,vals:[2],        maxParts:2,maxPart:1,dots:true, frac:1},
  {W:3,H:3,nT:2,vals:[2,3],      maxParts:2,maxPart:2,dots:true, frac:1},
  {W:3,H:4,nT:3,vals:[2,3],      maxParts:2,maxPart:2,dots:true, frac:.67},
  {W:4,H:4,nT:3,vals:[3,4],      maxParts:2,maxPart:3,dots:true, frac:.5},
  {W:4,H:4,nT:3,vals:[3,4,5],    maxParts:3,maxPart:3,dots:false,frac:.5},
  {W:4,H:5,nT:3,vals:[4,5],      maxParts:3,maxPart:3,dots:false,frac:.5},
  {W:4,H:5,nT:4,vals:[4,5,6],    maxParts:3,maxPart:3,dots:false,frac:.5},
  {W:5,H:5,nT:4,vals:[5,6,7],    maxParts:3,maxPart:4,dots:false,frac:.4},
  {W:5,H:6,nT:4,vals:[6,7,8],    maxParts:3,maxPart:4,dots:false,frac:.4},
  {W:5,H:6,nT:4,vals:[7,8,9,10], maxParts:3,maxPart:5,dots:false,frac:.4}
];
const WORDS=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const DIRS={top:[0,-1],bottom:[0,1],left:[-1,0],right:[1,0]};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let mode=store.get('lbo.mode','color');
/* 10 puzzles per difficulty step, 10 steps: levels 1-100, then it keeps counting at the top difficulty */
const lvlKey=m=>m==='math'?'lbo.math.level':'lbo.level';
function loadLevel(m){
  let L=store.get(lvlKey(m),null);
  if(L===null){const old=store.get(m==='math'?'lbo.math.completed':'lbo.completed',0);L=Math.min(old,9)*10+1}
  return Math.max(1,Math.floor(L)||1);
}
const tierOf=L=>Math.min(10,Math.ceil(L/10));
let level=loadLevel(mode);
let soundOn=store.get('lbo.sound',true);

/* ---------- shared geometry ---------- */
const R=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const horiz=s=>s==='top'||s==='bottom';
function cellsOf(b){const o=[];for(let i=0;i<b.w;i++)for(let j=0;j<b.h;j++)o.push((b.x+i)+','+(b.y+j));return o}
function sweep(b,side,W,H){
  const o=[];
  if(side==='bottom')for(let y=b.y+b.h;y<H;y++)for(let x=b.x;x<b.x+b.w;x++)o.push(x+','+y);
  if(side==='top')for(let y=b.y-1;y>=0;y--)for(let x=b.x;x<b.x+b.w;x++)o.push(x+','+y);
  if(side==='right')for(let x=b.x+b.w;x<W;x++)for(let y=b.y;y<b.y+b.h;y++)o.push(x+','+y);
  if(side==='left')for(let x=b.x-1;x>=0;x--)for(let y=b.y;y<b.y+b.h;y++)o.push(x+','+y);
  return o;
}
function fits(b,g){return horiz(g.side)?(b.x>=g.start&&b.x+b.w<=g.start+g.len):(b.y>=g.start&&b.y+b.h<=g.start+g.len)}
function occ(blocks,except){const m=new Map();for(const b of blocks)if(b!==except)for(const c of cellsOf(b))m.set(c,b);return m}
const matches=(b,g)=>g.value!==undefined?g.value===b.v:g.color===b.color;
const gateFor=(lv,b)=>lv.gates.find(g=>matches(b,g));
function blockerOf(lv,b){
  const g=gateFor(lv,b),m=occ(lv.blocks,b);
  for(const c of sweep(b,g.side,lv.W,lv.H))if(m.has(c))return m.get(c);
  return null;
}
const canExit=(lv,b)=>{const g=gateFor(lv,b);return !!g&&fits(b,g)&&!blockerOf(lv,b)};
function makeGates(W,H,sides,frac,minLen,extra){
  return sides.map((s,i)=>{
    const sl=horiz(s)?W:H;
    let len=Math.max(1,Math.round(sl*frac));
    len=Math.min(sl,Math.max(len,minLen));
    return Object.assign({side:s,start:R(sl-len+1),len},extra(i));
  });
}

/* ---------- color mode generation ---------- */
function rounds(lv){
  let bl=lv.blocks.slice(),r=0;
  while(bl.length){
    const t={...lv,blocks:bl},out=bl.filter(b=>canExit(t,b));
    if(!out.length)return 99;
    bl=bl.filter(b=>!out.includes(b));r++;
  }
  return r;
}
function tryGen(p){
  const {W,H,k}=p;
  const cols=shuffle([0,1,2,3]).slice(0,k);
  const gates=makeGates(W,H,shuffle(['top','bottom','left','right']).slice(0,k),p.frac,p.long>0?2:1,i=>({color:cols[i]}));
  const blocks=[];
  function collect(sizes){
    const m=occ(blocks),out=[];
    for(const [w,h] of sizes)for(let x=0;x+w<=W;x++)for(let y=0;y+h<=H;y++){
      const b0={x,y,w,h},cells=cellsOf(b0);
      if(cells.some(c=>m.has(c)))continue;
      for(const g of gates){
        if(!fits(b0,g))continue;
        const path=sweep(b0,g.side,W,H);
        if(path.some(c=>m.has(c)))continue;
        const blocking=blocks.filter(o=>cells.some(c=>o.path.has(c))).length;
        const used=blocks.filter(o=>o.color===g.color).length;
        out.push({b:{x,y,w,h,color:g.color},path,wt:(1+3*blocking)/(1+used)});
      }
    }
    return out;
  }
  for(let i=0;i<p.n;i++){
    const isLong=Math.random()<p.long;
    let c=collect(isLong?[[2,1],[1,2]]:[[1,1]]);
    if(!c.length&&isLong)c=collect([[1,1]]);
    if(!c.length)break;
    let tot=c.reduce((s,x)=>s+x.wt,0),r=Math.random()*tot,pick=c[c.length-1];
    for(const x of c){r-=x.wt;if(r<=0){pick=x;break}}
    pick.b.path=new Set(pick.path);blocks.push(pick.b);
  }
  return {mode:'color',W,H,gates,blocks:blocks.map(({x,y,w,h,color})=>({x,y,w,h,color}))};
}
function gen(p){
  let best=null,bs=-1;
  for(let a=0;a<150;a++){
    const lv=tryGen(p),r=rounds(lv),cu=new Set(lv.blocks.map(b=>b.color)).size;
    if(lv.blocks.length===p.n&&r>=p.minR&&r<=p.minR+1&&cu===Math.min(p.k,p.n))return lv;
    const s=lv.blocks.length*10+Math.min(r,p.minR)*3+cu-(r>p.minR+1?6:0);
    if(r<99&&s>bs){bs=s;best=lv}
  }
  return best;
}

/* ---------- adding mode generation ---------- */
function partitionable(vals,gates){
  const memo=new Map();
  function rec(arr){
    if(!arr.length)return true;
    const key=arr.join(',');
    if(memo.has(key))return memo.get(key);
    const a=arr[0],rest=arr.slice(1);
    let ok=false;
    for(const g of gates){
      if(g<a)continue;
      if(pick(rest,0,g-a,[])){ok=true;break}
    }
    memo.set(key,ok);return ok;
  }
  function pick(rest,i,need,used){
    if(need===0)return rec(rest.filter((_,j)=>!used.includes(j)));
    for(let j=i;j<rest.length;j++){
      if(rest[j]>need)continue;
      if(j>i&&rest[j]===rest[j-1]&&!used.includes(j-1))continue;
      used.push(j);
      if(pick(rest,j+1,need-rest[j],used))return true;
      used.pop();
    }

let start=null;
function freeAt(b,x,y){

function tryStep(s,axis,sign){

  if(out){
    const side=axis==='x'?(sign>0?'right':'left'):(sign>0?'bottom':'top');

    if(g&&matches(b,g)&&fits(b,g)&&exitOK(b)){s.exited=true;exitBlock(b,s.el,g);return true}
    if(s.bumped!==side){s.bumped=side;nudge(s.el,side,cell*.07);bump();buzz(6)}

  const ty=Math.max(-1,Math.min(lv.H-b.h+1,s.by+Math.round(fy)));
  for(let i=0;i<40&&!s.exited;i++){
    const dx=tx-b.x,dy=ty-b.y;

    const order=Math.abs(dx)>=Math.abs(dy)?['x','y']:['y','x'];
    let moved=false;

  sndBtn.setAttribute('aria-pressed',String(soundOn));
  sndBtn.style.opacity=soundOn?'':'.9';
  sndSw.setAttribute('aria-checked',String(soundOn));
}
function setSound(on){soundOn=on;store.set('lbo.sound',soundOn);drawSound();if(soundOn)tick();else try{speechSynthesis.cancel()}catch(e){}}
sndBtn.addEventListener('click',()=>setSound(!soundOn));
sndSw.addEventListener('click',()=>setSound(!soundOn));
drawSound();
const mathBtn=document.getElementById('mathBtn');
function drawMode(){mathBtn.classList.toggle('on',mode==='math');mathBtn.setAttribute('aria-pressed',String(mode==='math'))}
function switchMode(m,L){
  mode=m;store.set('lbo.mode',mode);
  level=L||loadLevel(mode);store.set(lvlKey(mode),level);
  drawMode();newLevel(true);
}
mathBtn.addEventListener('click',()=>{
  tick();switchMode(mode==='math'?'color':'math');
  if(mode==='math')say('adding');
});
drawMode();

/* secret parent menu: press and hold the level number */
const panel=document.getElementById('panel'),lvlEl=document.getElementById('lvl');
const lvOut=document.getElementById('lvOut'),lvHint=document.getElementById('lvHint'),chipsEl=document.getElementById('chips');
const gColor=document.getElementById('gColor'),gMath=document.getElementById('gMath'),applyBtn=document.getElementById('apply');
let pMode=mode,pLevel=level,lpT=null;
for(let t=1;t<=10;t++){
  const c=document.createElement('button');c.textContent=(t-1)*10+1;c.dataset.l=(t-1)*10+1;
  c.addEventListener('click',()=>{pLevel=+c.dataset.l;drawPanel()});
  chipsEl.appendChild(c);
}
function drawPanel(){
  gColor.setAttribute('aria-pressed',String(pMode==='color'));
  gMath.setAttribute('aria-pressed',String(pMode==='math'));
  lvOut.textContent=pLevel;
  const t=tierOf(pLevel);
  lvHint.textContent=pLevel>100?'Difficulty 10 of 10 (top)':`Difficulty ${t} of 10 · puzzle ${(pLevel-1)%10+1} of 10`;
  [...chipsEl.children].forEach(c=>c.setAttribute('aria-pressed',String(tierOf(+c.dataset.l)===t&&pLevel<=100)));
  applyBtn.textContent=`Play level ${pLevel}`;
}
function openPanel(){pMode=mode;pLevel=level;drawPanel();panel.hidden=false;clearHint()}
gColor.addEventListener('click',()=>{if(pMode!=='color'){pMode='color';pLevel=loadLevel('color')}drawPanel()});
gMath.addEventListener('click',()=>{if(pMode!=='math'){pMode='math';pLevel=loadLevel('math')}drawPanel()});
document.getElementById('lvMinus').addEventListener('click',()=>{pLevel=Math.max(1,pLevel-1);drawPanel()});
document.getElementById('lvPlus').addEventListener('click',()=>{pLevel=Math.min(999,pLevel+1);drawPanel()});
document.getElementById('keep').addEventListener('click',()=>{panel.hidden=true;armHint()});
applyBtn.addEventListener('click',()=>{panel.hidden=true;switchMode(pMode,pLevel)});
lvlEl.addEventListener('pointerdown',()=>{lvlEl.classList.add('pressing');lpT=setTimeout(()=>{lvlEl.classList.remove('pressing');openPanel()},2000)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>lvlEl.addEventListener(ev,()=>{clearTimeout(lpT);lvlEl.classList.remove('pressing')}));

let rT=null;
addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(!winning)render()},120)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ac)wake()});

newLevel(false);
})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
