<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Little Block Out</title>
<meta name="theme-color" content="#E4D3B4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blocks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html{box-sizing:border-box;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#E4D3B4;overscroll-behavior:none}
body{margin:0;font:14px system-ui,sans-serif}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
:root{
  /* layout: one-screen play surface; a wooden tray centered in the room, parent controls tucked quietly into the top corners */
  --wood:#E4D3B4;
  --wood-hi:#EEE1C8;
  --tray:#C9B28A;
  --well:#D6C29E;
  --ink:#6B5840;
  --ink-soft:#9C8767;
  --dot:#CDB993;
  --dot-on:#7A6448;
  --panel:#F3EAD8;
  --walnut:#7A5C3A;
  --cream:#F6EBD6;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Quicksand",system-ui,sans-serif;
  --num:"Fredoka",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0;box-sizing:border-box;overflow:hidden;
  background:radial-gradient(ellipse 90% 70% at 50% 42%,var(--wood-hi),var(--wood));
  background-color:var(--wood);
  color:var(--ink);font-family:var(--font);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{height:100%;display:flex;flex-direction:column}
.bar{height:92px;flex:none;display:grid;grid-template-columns:96px 1fr 96px;align-items:center}
.lvl{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 10px;cursor:default;transition:transform .3s}
.lvl.pressing{transform:scale(.92)}
.lvnum{font-family:var(--num);font-weight:600;font-size:30px;line-height:1;color:var(--ink);min-width:48px;height:42px;padding:0 12px;box-sizing:border-box;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--well);box-shadow:inset 0 2px 4px rgba(90,62,28,.2),0 1px 0 rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
.lvnum.pop{animation:lvpop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes lvpop{35%{transform:scale(1.35)}}
.holdtip{font-size:11px;letter-spacing:.06em;color:var(--ink-soft);opacity:.75;line-height:1}
.side{display:flex;align-items:center;gap:4px}
.side.r{justify-content:flex-end}
.icon{width:44px;height:44px;border:0;background:none;padding:10px;color:var(--ink-soft);opacity:.55;border-radius:12px;cursor:pointer;flex:none}
.icon:focus-visible{outline:2px solid var(--ink-soft);opacity:1}
.icon svg{width:24px;height:24px;display:block}
.mathbtn{font-family:var(--num);font-weight:600;font-size:15px;padding:0;letter-spacing:.02em;transition:background .25s,color .25s,opacity .25s}
.mathbtn.on{opacity:1;color:var(--cream);background:var(--walnut)}
.dots{display:flex;justify-content:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dot);transition:background .4s,transform .4s}
.dot.on{background:var(--dot-on)}
.dot.now{box-shadow:0 0 0 2px var(--wood),0 0 0 3.5px var(--dot-on)}
.dot.pop{animation:pop .6s ease-out}
@keyframes pop{40%{transform:scale(1.8)}}
#stage{flex:1;position:relative;min-height:0}
#tray{position:absolute;background:var(--tray);box-shadow:inset 0 3px 8px rgba(90,62,28,.28),0 1px 0 rgba(255,255,255,.55),0 10px 30px rgba(110,80,40,.14)}
.well{position:absolute;background:var(--well);box-shadow:inset 0 2px 4px rgba(90,62,28,.2)}
.stone{position:absolute;pointer-events:none;border-radius:38% 42% 40% 36%;
  background:radial-gradient(circle at 35% 28%,#CBC3B6 0%,#A99F90 46%,#887E70 100%);
  box-shadow:0 4px 0 #6F665A,0 8px 12px rgba(70,50,25,.2),inset 0 -3px 6px rgba(60,50,40,.2)}
.stone::before{content:"";position:absolute;left:22%;top:18%;width:22%;height:14%;border-radius:50%;background:rgba(255,255,255,.28);transform:rotate(-20deg)}
.stone::after{content:"";position:absolute;right:24%;bottom:26%;width:10%;height:10%;border-radius:50%;background:rgba(80,70,58,.28);box-shadow:-9px -4px 0 -1px rgba(80,70,58,.2)}
.gate{position:absolute;box-shadow:inset 0 -2px 0 rgba(0,0,0,.14),0 1px 0 rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;gap:5px;transition:filter .4s}
.gate.v{flex-direction:column}
.gate.locked{filter:saturate(.35) brightness(.9)}
.gate b{font-family:var(--num);font-weight:600;color:var(--gi,var(--cream));line-height:1}
.gate i{display:block;border-radius:50%;background:var(--gi,var(--cream));opacity:.85}
.gate .gd{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;align-items:center}
.gate.v .gd{flex-direction:column}
.padlock{position:absolute;pointer-events:none;z-index:2;filter:drop-shadow(0 2px 2px rgba(60,40,15,.3))}
.padlock svg,.key svg{width:100%;height:100%;display:block}
.key{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(60,40,15,.3));animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8%) rotate(-6deg)}}
.pot{position:absolute;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle at 42% 38%,var(--pl) 0%,var(--pf) 48%,var(--pd) 100%);
  box-shadow:0 0 0 var(--rim) #7A5C3A,0 0 0 calc(var(--rim) + 2px) rgba(255,255,255,.3),0 5px 9px rgba(70,50,25,.3)}
.pot::after{content:"";position:absolute;left:22%;top:18%;width:26%;height:16%;border-radius:50%;background:rgba(255,255,255,.5);transform:rotate(-25deg)}
.block{position:absolute;cursor:grab;touch-action:none;transition:scale .15s ease-out,left .1s ease-out,top .1s ease-out;
  background:linear-gradient(180deg,var(--l) 0%,var(--f) 38%,var(--f) 100%);
  box-shadow:0 4px 0 var(--d),0 8px 14px rgba(80,55,20,.2),inset 0 1px 0 rgba(255,255,255,.4)}
.block.held{scale:1.05;z-index:4}
.block.crate{background:linear-gradient(180deg,#E8D0A6 0%,#D8BA89 40%,#CEAD78 100%);
  box-shadow:0 4px 0 #A6814E,0 8px 14px rgba(80,55,20,.2),inset 0 0 0 2px rgba(150,110,60,.3)}
.block.crate::before{content:"";position:absolute;inset:15%;border:2.5px solid rgba(140,100,55,.42);border-radius:12%}
.block.crate::after{content:"";position:absolute;left:-1%;right:-1%;top:50%;height:2.5px;margin-top:-1.25px;background:rgba(140,100,55,.42);transform:rotate(-45deg)}
.knob{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 36% 30%,var(--kl,var(--l)) 0%,var(--kf,var(--f)) 45%,var(--kd,var(--d)) 100%);
  box-shadow:0 3px 3px rgba(60,40,15,.28),0 0 0 1px rgba(0,0,0,.05)}
.knob.hole{background:radial-gradient(circle at 50% 36%,#4B5961 0%,#66767F 55%,#8D9DA6 100%);
  box-shadow:inset 0 3px 4px rgba(20,30,40,.45),0 1px 0 rgba(255,255,255,.4)}
.ice{position:absolute;inset:-4px -4px -8px -4px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,rgba(244,251,253,.8) 0%,rgba(214,238,246,.66) 55%,rgba(190,225,238,.7) 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),inset 0 -5px 10px rgba(110,165,190,.3),0 2px 6px rgba(80,130,150,.25)}
.ice::before{content:"";position:absolute;left:14%;top:10%;width:20%;height:44%;border-radius:999px;background:rgba(255,255,255,.7);transform:rotate(28deg)}
.ice svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .2s}
.ice.cracked{background:linear-gradient(140deg,rgba(244,251,253,.62),rgba(214,238,246,.5) 55%,rgba(190,225,238,.55))}
.ice.cracked svg{opacity:1}
.eq{position:absolute;z-index:5;pointer-events:none;white-space:nowrap;font-family:var(--num);font-weight:600;color:var(--ink);
  background:#FBF5EA;border-radius:999px;box-shadow:0 6px 16px rgba(80,55,20,.18),0 0 0 1px rgba(120,90,50,.12)}
.eq.why{white-space:normal;text-align:center;line-height:1.25;font-weight:500;border-radius:16px;background:#FFF9EF;z-index:6}
.cheer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;pointer-events:none}
.cheer i{border-radius:50%;display:block;animation:hop .7s cubic-bezier(.3,.7,.4,1) 2 alternate both;
  background:radial-gradient(circle at 36% 30%,var(--l) 0%,var(--f) 45%,var(--d) 100%);box-shadow:0 6px 8px rgba(60,40,15,.25)}
@keyframes hop{0%{transform:translateY(30px) scale(.3);opacity:0}60%{opacity:1}100%{transform:translateY(-26px) scale(1);opacity:1}}
.panel{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(80,60,35,.25);padding:24px}
.card{background:var(--panel);border-radius:22px;padding:22px 20px;width:100%;max-width:340px;box-sizing:border-box;box-shadow:0 20px 50px rgba(60,40,15,.25);display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto}
.card h2{margin:0;font-family:var(--num);font-weight:600;font-size:20px;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:8px}
.field.inline{flex-direction:row;align-items:center;justify-content:space-between}
.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.card button{font:inherit;font-size:15px;border:0;border-radius:999px;padding:11px 18px;cursor:pointer;background:var(--well);color:var(--ink)}
.card button.go{background:var(--ink);color:var(--panel)}
.card button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--well);border-radius:999px;padding:4px;gap:4px}
.card .seg button{padding:9px 10px;background:none}
.card .seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 3px rgba(80,55,20,.2);font-weight:600}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .stepper button{width:52px;height:52px;padding:0;font-size:26px;line-height:1;font-family:var(--num)}
.stepper output{font-family:var(--num);font-weight:600;font-size:38px;color:var(--ink);font-variant-numeric:tabular-nums}
.hint{margin:0;text-align:center;font-size:13px;line-height:1.45;color:var(--ink-soft);text-wrap:balance}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card .chips button{padding:8px 0;font-size:14px;font-family:var(--num);font-variant-numeric:tabular-nums}
.card .chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.card .switch{width:54px;height:32px;padding:3px;border-radius:999px;background:var(--dot);position:relative;transition:background .2s}
.switch span{display:block;width:26px;height:26px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(60,40,15,.3);transition:transform .2s}
.card .switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"] span{transform:translateX(22px)}
.card .row{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
@media (prefers-reduced-motion:reduce){.cheer i{animation-duration:.01s}.dot.pop{animation:none}.key{animation:none}}
</style>

<div id="app">
  <div class="bar">
    <div class="side">
      <button class="icon" id="fs" aria-label="Full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="icon mathbtn" id="mathBtn" aria-label="Adding mode" aria-pressed="false">1+2</button>
    </div>
    <div class="lvl" id="lvl">
      <div class="lvnum" id="lvnum" aria-label="Level">1</div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="holdtip">Hold for menu</div>
    </div>
    <div class="side r">
      <button class="icon" id="snd" aria-label="Sound">
        <svg id="sndOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg>
        <svg id="sndOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M17 10l4 4M21 10l-4 4"/></svg>
      </button>
    </div>
  </div>
  <div id="stage"><div id="tray"></div></div>
</div>

<div class="panel" id="panel" hidden>
  <div class="card" role="dialog" aria-label="Parent settings">
    <h2>Parents</h2>
    <div class="field">
      <span class="lab">Game</span>
      <div class="seg"><button id="gColor">Colors</button><button id="gMath">Adding</button></div>
    </div>
    <div class="field">
      <span class="lab">Level</span>
      <div class="stepper">
        <button id="lvMinus" aria-label="Lower level">−</button>
        <output id="lvOut">1</output>
        <button id="lvPlus" aria-label="Higher level">+</button>
      </div>
      <p class="hint" id="lvHint">Difficulty 1 of 20</p>
      <div class="chips" id="chips"></div>
      <p class="hint" id="lvFeat"></p>
    </div>
    <div class="field inline">
      <span class="lab">Sound</span>
      <button class="switch" id="sndSw" role="switch" aria-checked="true" aria-label="Sound"><span></span></button>
    </div>
    <div class="field inline">
      <span class="lab">Helper bubbles</span>
      <button class="switch" id="helpSw" role="switch" aria-checked="true" aria-label="Helper bubbles"><span></span></button>
    </div>
    <div class="row">
      <button id="keep">Cancel</button>
      <button class="go" id="apply">Play level 1</button>
    </div>
  </div>
</div>

<script>
(()=>{
/* ================= puzzle logic (no DOM) ================= */
const COLORS=[
  {f:'#C8704E',d:'#9D4E31',l:'#E29676'},
  {f:'#7FA27A',d:'#5A7D56',l:'#A6C4A0'},
  {f:'#DCA93B',d:'#B0821E',l:'#F0CA6E'},
  {f:'#6E93B4',d:'#4D7091',l:'#98B7D2'}
];
const BLANK={f:'#EEE6D7',d:'#C7BBA3',l:'#FBF7F0'};
/* Montessori bead-stair colors, softened to sit with the wood: 1 red, 2 green, 3 pink, 4 yellow, 5 light blue, 6 lavender, 7 white, 8 brown, 9 dark blue, 10 gold */
const NUMC=[null,
  {f:'#C65A4E',d:'#983F35',l:'#DE8478'},
  {f:'#7FA27A',d:'#5A7D56',l:'#A6C4A0'},
  {f:'#D98CA0',d:'#AE6679',l:'#EDB2C1'},
  {f:'#E2BE48',d:'#B5922A',l:'#F2D67C'},
  {f:'#7FB0CF',d:'#5A8CAD',l:'#A9CCE3'},
  {f:'#9D8AC0',d:'#77649C',l:'#BFB2D9'},
  {f:'#EFE5D3',d:'#C6B699',l:'#FCF8EF'},
  {f:'#9A6B45',d:'#714D2E',l:'#BD9068'},
  {f:'#4F6F9A',d:'#384F73',l:'#7A98BF'},
  {f:'#BF8E3A',d:'#946A22',l:'#DDB46A'}
];
const NEG={f:'#AEBBC3',d:'#83939C',l:'#CDD7DD'};
const numColor=v=>v<0?NEG:NUMC[Math.min(Math.max(v,1),10)];
const CREAM={f:'#F3E8D3',d:'#CDBB9C',l:'#FFFBF2'};
const WALNUT={f:'#6E5134',d:'#4E3822',l:'#93734F'};
const WORDS=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
const DIRS={top:[0,-1],bottom:[0,1],left:[-1,0],right:[1,0]};
const SIDES=['top','bottom','left','right'];
const PER=5,TIERS=20;

/* color game: 20 difficulty steps; each new element arrives at its own step and then mixes in at random */
const CT=[null,
  {W:3,H:3,k:2,n:2,frac:1},
  {W:3,H:3,k:2,n:3,frac:1,stones:1},
  {W:3,H:4,k:3,n:4,frac:.67,stones:1},
  {W:4,H:4,k:3,n:5,frac:.5,stones:2,long:.2},
  {W:4,H:4,k:3,n:5,frac:.5,stones:1,crates:1,long:.2},
  {W:4,H:5,k:3,n:6,frac:.5,stones:2,crates:1,long:.25},
  {W:4,H:5,k:3,n:6,frac:.5,stones:1,crates:1,ice:1,long:.25},
  {W:4,H:5,k:4,n:7,frac:.5,stones:2,crates:1,ice:1,long:.3},
  {W:5,H:5,k:4,n:7,frac:.4,stones:2,crates:1,ice:1,lock:1,long:.3},
  {W:5,H:5,k:4,n:8,frac:.4,stones:2,crates:2,ice:1,lock:1,long:.3},
  {W:5,H:5,k:4,n:7,frac:.4,stones:2,crates:1,ice:1,lock:1,paint:1,long:.3},
  {W:5,H:6,k:4,n:8,frac:.4,stones:3,crates:2,ice:1,lock:1,paint:1,long:.35},
  {W:5,H:6,k:4,n:9,frac:.4,stones:3,crates:2,ice:2,lock:1,paint:1,long:.35},
  {W:5,H:6,k:4,n:9,frac:.4,stones:3,crates:2,ice:2,lock:1,paint:2,long:.4},
  {W:5,H:6,k:4,n:10,frac:.4,stones:4,crates:2,ice:2,lock:1,paint:2,long:.4},
  {W:6,H:6,k:4,n:10,frac:.34,stones:4,crates:2,ice:2,lock:1,paint:2,long:.4},
  {W:6,H:6,k:4,n:11,frac:.34,stones:4,crates:3,ice:2,lock:1,paint:2,long:.45},
  {W:6,H:6,k:4,n:11,frac:.34,stones:5,crates:3,ice:2,lock:1,paint:2,long:.45},
  {W:6,H:7,k:4,n:12,frac:.34,stones:5,crates:3,ice:3,lock:1,paint:2,long:.45},
  {W:6,H:7,k:4,n:12,frac:.34,stones:6,crates:3,ice:3,lock:1,paint:3,long:.5}
];
/* adding game: numbers climb fast, obstacles join, take-away blocks near the top */
const MT=[null,
  {W:3,H:3,vals:[2,3],nG:1,nT:2,maxPart:2,kMax:2,dots:1,frac:1},
  {W:3,H:3,vals:[2,3,4],nG:2,nT:2,maxPart:2,kMax:2,dots:1,frac:1},
  {W:3,H:4,vals:[3,4,5],nG:2,nT:3,maxPart:3,kMax:2,dots:1,frac:.67,stones:1},
  {W:4,H:4,vals:[4,5,6],nG:2,nT:3,maxPart:3,kMax:2,dots:1,frac:.5,stones:2},
  {W:4,H:4,vals:[4,5,6,7],nG:3,nT:3,maxPart:4,kMax:2,frac:.5,stones:2,crates:1},
  {W:4,H:5,vals:[5,6,7],nG:3,nT:4,maxPart:4,kMax:3,frac:.5,stones:2,crates:1},
  {W:4,H:5,vals:[5,6,7,8],nG:3,nT:4,maxPart:4,kMax:3,frac:.4,stones:2,crates:1,ice:1},
  {W:5,H:5,vals:[6,7,8],nG:3,nT:4,maxPart:4,kMax:3,frac:.4,stones:3,crates:1,ice:2},
  {W:5,H:5,vals:[6,7,8,9],nG:3,nT:4,maxPart:5,kMax:3,frac:.4,stones:2,crates:1,ice:1,lock:1},
  {W:5,H:5,vals:[7,8,9,10],nG:4,nT:4,maxPart:5,kMax:3,frac:.4,stones:3,crates:2,ice:1,lock:1},
  {W:5,H:6,vals:[5,6,7,8,9,10],nG:4,nT:5,maxPart:5,kMax:3,frac:.4,stones:3,crates:2,ice:2,lock:1},
  {W:5,H:6,vals:[6,7,8,9,10],nG:4,nT:5,maxPart:5,kMax:3,frac:.4,stones:4,crates:2,ice:2,lock:1},

const INTRO_C={stones:2,crates:5,ice:7,lock:9,paint:11};
const INTRO_M={stones:3,crates:5,ice:7,lock:9,neg:13,zero:15};
const NAMES={stones:'stones',crates:'crates',ice:'ice',lock:'lock and key',paint:'paint pots',neg:'take-away blocks',zero:'zero pairs'};

let PID=0,MERGE_T=0;
const R=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const horiz=s=>s==='top'||s==='bottom';
const K=(x,y)=>x+','+y;
const cover=(x,y,w,h,c)=>!!c&&c.x>=x&&c.x<x+w&&c.y>=y&&c.y<y+h;
function cellsOf(p){const o=[];for(let i=0;i<p.w;i++)for(let j=0;j<p.h;j++)o.push(K(p.x+i,p.y+j));return o}
function fits(p,g){return horiz(g.side)?(p.x>=g.start&&p.x+p.w<=g.start+g.len):(p.y>=g.start&&p.y+p.h<=g.start+g.len)}
function touches(lv,p,side){return side==='bottom'?p.y+p.h===lv.H:side==='top'?p.y===0:side==='right'?p.x+p.w===lv.W:p.x===0}
function occMap(lv,except){const m=new Map();for(const p of lv.pieces)if(p!==except)for(const c of cellsOf(p))m.set(c,p);return m}
function freeFor(lv,occ,x,y,w,h){
  if(x<0||y<0||x+w>lv.W||y+h>lv.H)return false;
  for(let i=0;i<w;i++)for(let j=0;j<h;j++){const c=K(x+i,y+j);if(lv.stones.has(c)||occ.has(c))return false}
  return true;
}
function reach(lv,p){
  const occ=occMap(lv,p),seen=new Set([K(p.x,p.y)]),q=[[p.x,p.y]],out=[];
  for(let qi=0;qi<q.length;qi++){
    const [x,y]=q[qi];out.push(q[qi]);
    for(const [dx,dy] of D4){const nx=x+dx,ny=y+dy,k=K(nx,ny);if(!seen.has(k)&&freeFor(lv,occ,nx,ny,p.w,p.h)){seen.add(k);q.push([nx,ny])}}
  }
  return out;
}
function sweep(lv,p,side){
  const o=[];
  if(side==='bottom')for(let y=p.y+p.h;y<lv.H;y++)for(let x=p.x;x<p.x+p.w;x++)o.push(K(x,y));
  if(side==='top')for(let y=p.y-1;y>=0;y--)for(let x=p.x;x<p.x+p.w;x++)o.push(K(x,y));
  if(side==='right')for(let x=p.x+p.w;x<lv.W;x++)for(let y=p.y;y<p.y+p.h;y++)o.push(K(x,y));
  if(side==='left')for(let x=p.x-1;x>=0;x--)for(let y=p.y;y<p.y+p.h;y++)o.push(K(x,y));
  return o;
}
const matches=(lv,p,g)=>p.kind==='block'&&(lv.mode==='math'?g.value===p.v:g.color===p.color);
const gateOf=(lv,p)=>lv.gates.find(g=>matches(lv,p,g));
function straightBlocker(lv,p,g){
  const occ=occMap(lv,p);
  for(const c of sweep(lv,p,g.side)){if(lv.stones.has(c))return 'stone';if(occ.has(c))return occ.get(c)}
  return null;
}
function makeGates(W,H,sides,frac,minLen,extra){
  return sides.map((s,i)=>{
    const sl=horiz(s)?W:H;
    let len=Math.max(1,Math.round(sl*frac));
    len=Math.min(sl,Math.max(len,minLen));
    return Object.assign({side:s,start:R(sl-len+1),len,locked:false},extra(i));
  });
}
function edgeCells(W,H,g){
  const o=[];
  for(let i=g.start;i<g.start+g.len;i++){
    if(g.side==='top')o.push(K(i,0));if(g.side==='bottom')o.push(K(i,H-1));
    if(g.side==='left')o.push(K(0,i));if(g.side==='right')o.push(K(W-1,i));
  }
  return o;
}
/* stones may never cut the board in two, leave a dead-end pocket, or wall off a gate */
function stonesOK(W,H,st,gates){
  const open=[];for(let x=0;x<W;x++)for(let y=0;y<H;y++)if(!st.has(K(x,y)))open.push([x,y]);
  for(const [x,y] of open){
    let d=0;for(const [dx,dy] of D4){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<W&&ny<H&&!st.has(K(nx,ny)))d++}
    if(d<2)return false;
  }
  const seen=new Set([K(...open[0])]),q=[open[0]];
  for(let i=0;i<q.length;i++){const [x,y]=q[i];for(const [dx,dy] of D4){const nx=x+dx,ny=y+dy,k=K(nx,ny);if(nx>=0&&ny>=0&&nx<W&&ny<H&&!st.has(k)&&!seen.has(k)){seen.add(k);q.push([nx,ny])}}}
  if(seen.size!==open.length)return false;
  for(const g of gates){const free=edgeCells(W,H,g).filter(c=>!st.has(c)).length;if(free<Math.max(1,g.len-1))return false}
  return true;
}
function placeStones(W,H,n,gates){
  const st=new Set();if(!n)return st;
  const cells=shuffle([...Array(W*H)].map((_,i)=>[i%W,Math.floor(i/W)]));
  for(const [x,y] of cells){
    if(st.size>=n)break;
    st.add(K(x,y));
    if(!stonesOK(W,H,st,gates))st.delete(K(x,y));
  }
  return st.size===n?st:null;
}
function features(s,intro,tier){
  const out={},keys=Object.keys(intro).filter(k=>s[k]);
  for(const k of keys){
    if(intro[k]===tier)out[k]=s[k];
    else if(intro[k]<tier&&Math.random()<.65)out[k]=1+R(s[k]);
  }
  if(tier>=2&&!Object.keys(out).length&&keys.length){const k=keys[R(keys.length)];out[k]=s[k]}
  return out;
}
const cloneLv=lv=>({...lv,gates:lv.gates.map(g=>({...g})),pieces:lv.pieces.map(p=>({...p})),pots:lv.pots.map(o=>({...o})),key:lv.key&&{...lv.key}});

/* ----- color game ----- */
function layoutColor(s,f){
  const {W,H,k}=s;
  const cols=shuffle([0,1,2,3]).slice(0,k);
  const gates=makeGates(W,H,shuffle(SIDES.slice()).slice(0,k),s.frac,s.long?2:1,i=>({color:cols[i]}));
  const stones=placeStones(W,H,f.stones||0,gates);
  if(!stones)return null;
  const lv={mode:'color',W,H,gates,stones,pieces:[],key:null,keyTaken:true,pots:[]};
  const open=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!stones.has(K(x,y)))open.push({x,y});
  const blocked=new Set();
  const fitsAt=(x,y,w,h)=>{if(x+w>W||y+h>H)return false;for(let i=0;i<w;i++)for(let j=0;j<h;j++){const c=K(x+i,y+j);if(stones.has(c)||blocked.has(c))return false}return true};
  const spot=(w,h)=>shuffle(open.slice()).find(c=>fitsAt(c.x,c.y,w,h))||null;
  if(f.lock){const g=gates[R(gates.length)];g.locked=true;const c=spot(1,1);if(!c)return null;blocked.add(K(c.x,c.y));lv.key={x:c.x,y:c.y};lv.keyTaken=false}
  const nGray=Math.min(f.paint||0,s.n-1);
  if(nGray){const c=spot(1,1);if(!c)return null;blocked.add(K(c.x,c.y));lv.pots.push({x:c.x,y:c.y,color:cols[R(k)]})}
  const colors=[];for(let i=0;i<s.n;i++)colors.push(cols[i%k]);shuffle(colors);
  for(let i=0;i<nGray;i++)colors[i]=-1;
  const put=p=>{for(const c of cellsOf(p))blocked.add(c);lv.pieces.push(p)};
  for(const color of colors){
    let w=1,h=1;
    if(color>=0&&s.long&&Math.random()<s.long){if(Math.random()<.5)w=2;else h=2}
    let c=spot(w,h);if(!c&&(w>1||h>1)){w=h=1;c=spot(1,1)}
    if(!c)return null;
    put({id:++PID,kind:'block',x:c.x,y:c.y,w,h,color,ice:0});
  }
  for(let i=0;i<(f.crates||0);i++){const c=spot(1,1);if(!c)return null;put({id:++PID,kind:'crate',x:c.x,y:c.y,w:1,h:1,ice:0})}
  const pc=lv.pieces.reduce((t,p)=>t+p.w*p.h,0);
  if(open.length-pc<Math.max(3,Math.ceil(open.length*.3)))return null;
  if(f.ice){const cand=shuffle(lv.pieces.filter(p=>p.kind==='block'));for(let i=0;i<Math.min(f.ice,cand.length);i++)cand[i].ice=2}
  return lv;
}
/* plays the puzzle with simple moves; a layout is kept only if this finishes it */
function greedyColor(lv){
  let stuck=0;
  for(let step=0;step<400;step++){
    if(!lv.pieces.some(p=>p.kind==='block'))return true;
    let prog=false;
    if(!lv.keyTaken){
      for(const p of shuffle(lv.pieces.slice())){
        const pos=reach(lv,p).find(([x,y])=>cover(x,y,p.w,p.h,lv.key));
        if(pos){p.x=pos[0];p.y=pos[1];lv.keyTaken=true;for(const g of lv.gates)g.locked=false;prog=true;break}
      }
    }
    if(!prog)for(const p of lv.pieces){
      if(p.kind!=='block')continue;
      if(p.color<0){
        const pos=reach(lv,p).find(([x,y])=>lv.pots.some(o=>cover(x,y,p.w,p.h,o)));
        if(pos){p.x=pos[0];p.y=pos[1];p.color=lv.pots.find(o=>cover(p.x,p.y,p.w,p.h,o)).color;prog=true;break}
        continue;
      }
      const g=lv.gates.find(g=>g.color===p.color);
      if(!g||g.locked)continue;
      const pos=reach(lv,p).find(([x,y])=>{const t={x,y,w:p.w,h:p.h};return touches(lv,t,g.side)&&fits(t,g)});
      if(pos){lv.pieces=lv.pieces.filter(x=>x!==p);prog=true;break}
    }
    if(prog){stuck=0;continue}
    if(++stuck>50)return false;
    const p=lv.pieces[R(lv.pieces.length)],rs=reach(lv,p);
    if(rs.length>1){const [x,y]=rs[1+R(rs.length-1)];p.x=x;p.y=y}
  }
  return false;
}
function easyCount(lv){
  let n=0;
  for(const p of lv.pieces){
    if(p.kind!=='block'||p.color<0||p.ice)continue;
    const g=gateOf(lv,p);
    if(g&&!g.locked&&fits(p,g)&&!straightBlocker(lv,p,g))n++;
  }
  return n;
}
function genColor(tier){
  const s=CT[tier];
  const want=Math.max(0,Math.ceil(s.n*(1-tier/12)));
  let best=null,bs=1e9,valid=0;
  for(let a=0;a<160&&valid<(tier<=2?1:6);a++){
    const lv=layoutColor(s,features(s,INTRO_C,tier));
    if(!lv||!greedyColor(cloneLv(lv)))continue;
    valid++;
    const sc=Math.abs(easyCount(lv)-want)+Math.random()*.5;
    if(sc<bs){bs=sc;best=lv}
  }
  if(best)return best;
  for(;;){const lv=layoutColor(CT[1],{});if(lv)return lv}
}

/* ----- adding game ----- */
function splitN(t,maxPart,kMax){
  const kmin=Math.max(Math.ceil(t/maxPart),t>=2?2:1),kmax=Math.max(kmin,Math.min(kMax,t));
  for(let a=0;a<200;a++){
    const k=kmin+R(kmax-kmin+1);
    const cuts=shuffle([...Array(t-1)].map((_,i)=>i+1)).slice(0,k-1).sort((x,y)=>x-y);
    const parts=[];let prev=0;
    for(const c of [...cuts,t]){parts.push(c-prev);prev=c}
    if(parts.every(x=>x<=maxPart))return parts;
  }
  return [t];
}
/* can these numbers still all leave? merges may go no higher than the biggest gate; a zero vanishes */
function solvable(vals,G,maxV,minV){
  const memo=new Map();let budget=40000;
  const rec=arr=>{
    if(!arr.length)return true;
    if(--budget<0)return true;
    const k=arr.join(',');
    const m=memo.get(k);if(m!==undefined)return m;
    memo.set(k,false);
    let ok=false;
    for(let i=0;i<arr.length&&!ok;i++){if(i&&arr[i]===arr[i-1])continue;if(G.has(arr[i]))ok=rec(arr.slice(0,i).concat(arr.slice(i+1)))}
    for(let i=0;i<arr.length&&!ok;i++){
      if(i&&arr[i]===arr[i-1])continue;
      for(let j=i+1;j<arr.length&&!ok;j++){
        if(j>i+1&&arr[j]===arr[j-1])continue;
        const s=arr[i]+arr[j];if(s>maxV||s<minV)continue;
        const r=arr.filter((_,t)=>t!==i&&t!==j);if(s!==0)r.push(s);r.sort((a,b)=>a-b);
        ok=rec(r);
      }
    }
    memo.set(k,ok);return ok;
  };
  return rec(vals.slice().sort((a,b)=>a-b));
}
/* same search as solvable, but returns the moves so a refusal can say which sum this block is saved for */
function planMoves(items,G,maxV,minV){
  const dead=new Set();let budget=30000;
  const rec=arr=>{
    if(!arr.length)return [];
    if(--budget<0)return null;
    const k=arr.map(x=>x.v).sort((a,b)=>a-b).join(',');
    if(dead.has(k))return null;
    for(let i=0;i<arr.length;i++)if(G.has(arr[i].v)){const r=rec(arr.filter((_,t)=>t!==i));if(r)return [{type:'exit',item:arr[i]},...r]}
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
      const sum=arr[i].v+arr[j].v;if(sum>maxV||sum<minV)continue;
      const m={v:sum,leaves:arr[i].leaves.concat(arr[j].leaves)};
      const rest=arr.filter((_,t)=>t!==i&&t!==j);if(sum!==0)rest.push(m);
      const r=rec(rest);if(r)return [{type:'merge',res:m},...r];
    }
    dead.add(k);return null;
  };
  return rec(items);
}
function layoutMath(s,f,nT){
  const {W,H}=s;
  const nG=Math.min(s.nG,s.vals.length);
  const gv=shuffle(s.vals.slice()).slice(0,nG);
  const maxV=Math.max(...gv);
  const gates=makeGates(W,H,shuffle(SIDES.slice()).slice(0,nG),s.frac,1,i=>({value:gv[i]}));
  const stones=placeStones(W,H,f.stones||0,gates);if(!stones)return null;
  const open=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!stones.has(K(x,y)))open.push({x,y});
  const targets=gv.slice();while(targets.length<nT)targets.push(gv[R(nG)]);
  let parts=[];for(const t of targets)parts.push(...splitN(t,s.maxPart,s.kMax));
  if(f.neg){
    const mag=s.negMag||1;
    for(let i=0;i<f.neg;i++){
      const m=1+R(mag);
      const idx=shuffle(parts.map((v,j)=>j).filter(j=>parts[j]>0&&parts[j]+m<=Math.min(maxV,10)));
      if(!idx.length)break;
      parts[idx[0]]+=m;parts.push(-m);
    }
  }
  if(f.zero)for(let i=0;i<f.zero;i++){const m=1+R(Math.min(2,maxV));parts.push(m,-m)}
  const crates=f.crates||0;
  if(parts.length+crates>open.length-Math.max(3,Math.ceil(open.length*.3)))return null;
  const G=new Set(gv),minV=(f.neg||f.zero)?-4:1;
  if(!solvable(parts,G,maxV,minV))return null;
  const lv={mode:'math',W,H,gates,stones,pieces:[],key:null,keyTaken:true,pots:[],dots:!!s.dots,G,maxV,minV};
  shuffle(open);let oi=0;
  if(f.lock){gates[R(nG)].locked=true;const c=open[oi++];lv.key={x:c.x,y:c.y};lv.keyTaken=false}
  for(const v of shuffle(parts)){const c=open[oi++];lv.pieces.push({id:++PID,kind:'block',x:c.x,y:c.y,w:1,h:1,v,tree:{v,t:0},ice:0})}
  for(let i=0;i<crates;i++){const c=open[oi++];lv.pieces.push({id:++PID,kind:'crate',x:c.x,y:c.y,w:1,h:1,ice:0})}
  if(f.ice){const cand=shuffle(lv.pieces.filter(p=>p.kind==='block'&&p.v>0));for(let i=0;i<Math.min(f.ice,cand.length);i++)cand[i].ice=2}
  return lv;
}
function genMath(tier){
  const s=MT[tier];
  for(let a=0;a<300;a++){
    const nT=Math.max(s.nG,s.nT-Math.floor(a/60));
    const lv=layoutMath(s,features(s,INTRO_M,tier),nT);
    if(lv)return lv;
  }
  for(;;){const lv=layoutMath(MT[1],{},2);if(lv)return lv}
}

function ensureAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}

  }
  if(ac){
    if(ac.state!=='running')ac.resume().catch(()=>{});
    try{const s=ac.createBufferSource();s.buffer=ac.createBuffer(1,1,22050);s.connect(ac.destination);s.start(0)}catch(e){}
  }

}

function tone(f,t0,dur,type,vol,f2){

  const s=p.v+other.v;
  if(s>lv.maxV)return why(p,`Too big! ${sumText([p.v,other.v])} = ${s}. The biggest door is ${lv.maxV}.`,'too big');
  if(s<lv.minV)return why(p,`Too small! ${sumText([p.v,other.v])} = ${fmt(s)}.`,'too small');
  why(p,savedFor(p),'not yet');
}
function whyNoExit(p,g){
  if(p.kind!=='block')return why(p,'Crates stay in the box. Slide them out of the way.');
  if(!matches(lv,p,g)){
    if(isMath())return p.v<0?why(p,'Add me to a block to take away.','add me to a block'):why(p,`This door needs ${g.value}. I'm ${p.v}.`,`this door needs ${word(g.value)}`);
    if(p.color<0)return why(p,'Dip me in the paint pot first.');
    return why(p,`This is the ${COLOR_NAMES[g.color]} door.`);
  }
  if(g.locked)return why(p,'Locked! Slide any block onto the key.','locked, find the key');
  if(!fits(p,g))return why(p,isMath()?'Slide over in front of the door.':'Line me up with the door.');
  if(!exitOK(p))return why(p,savedFor(p),'not yet');
}
/* adding: any two blocks may join if the total stays within the gates; a total of zero vanishes */
function canMerge(a,b){
  if(!isMath()||a.kind!=='block'||b.kind!=='block'||a.ice||b.ice)return false;
  const s=a.v+b.v;
  if(s>lv.maxV||s<lv.minV)return false;
  if(s===0)return solvable(blockVals([a,b]),lv.G,lv.maxV,lv.minV);
  return true;
}
function merge(a,b,elA){
  const from=a.v,to=b.v,sum=from+to,elB=els.get(b);
  lv.pieces=lv.pieces.filter(x=>x!==a);els.delete(a);elA.dataset.gone='1';elA.style.pointerEvents='none';
  const dx=(b.x-a.x)*cell,dy=(b.y-a.y)*cell;
  elA.style.zIndex='3';
  elA.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.7)`,opacity:0}],{duration:reduce?80:190,easing:'ease-in',fill:'forwards'}).onfinish=()=>{if(elA.isConnected)elA.remove()};
  snapSound();buzz(15);
  if(sum===0){
    lv.pieces=lv.pieces.filter(x=>x!==b);els.delete(b);
    if(elB){elB.dataset.gone='1';elB.style.pointerEvents='none'}
    say(eqWords(from,to,0));pending++;
    setTimeout(()=>{
      poofSound();showEq(b,eqText(from,to,0));
      if(elB)elB.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.3)',opacity:.6,offset:.4},{transform:'scale(0)',opacity:0}],{duration:reduce?100:520,easing:'ease-in',fill:'forwards'}).onfinish=()=>{elB.remove();pending=Math.max(0,pending-1);checkWin()};
      else{pending=Math.max(0,pending-1);checkWin()}
    },reduce?40:170);
    return;
  }
  b.v=sum;b.tree={v:sum,kids:[b.tree,a.tree],t:++MERGE_T};
  say(eqWords(from,to,sum));
  setTimeout(()=>{
    if(!elB)return;
    setVars(elB,numColor(sum));drawKnobs(elB,b);
    elB.animate([{transform:'scale(1)'},{transform:'scale(1.16)'},{transform:'scale(1)'}],{duration:reduce?100:380,easing:'cubic-bezier(.3,1.6,.5,1)'});
    showEq(b,eqText(from,to,sum));
  },reduce?40:170);
  deadSoon();
}
/* if a join leaves numbers that can no longer all leave, the newest join gently pops apart */
let deadT=null;
function deadSoon(ms){clearTimeout(deadT);deadT=setTimeout(deadFix,ms||1300)}
function deadFix(){
  if(!isMath()||winning)return;
  const vals=blockVals([]);
  if(!vals.length||solvable(vals,lv.G,lv.maxV,lv.minV))return;
  const m=lv.pieces.filter(p=>p.kind==='block'&&p.tree&&p.tree.kids).sort((a,b)=>b.tree.t-a.tree.t)[0];
  if(!m)return;
  if(start&&start.p===m){deadSoon(700);return}
  if(splitPiece(m))why(m,"Oops! Then the other blocks can't make the doors. Try another way.",'oops, try another way');
  deadSoon(900);
}
function nearestFree(x,y){
  const occ=occMap(lv),seen=new Set([K(x,y)]),q=[[x,y]];
  for(let i=0;i<q.length;i++){
    const [cx,cy]=q[i];
    for(const [dx,dy] of D4){
      const nx=cx+dx,ny=cy+dy,k=K(nx,ny);
      if(nx<0||ny<0||nx>=lv.W||ny>=lv.H||seen.has(k)||lv.stones.has(k))continue;
      if(!occ.has(k))return {x:nx,y:ny};
      seen.add(k);q.push([nx,ny]);
    }
  }
  return null;
}
function splitPiece(m){
  if(!m.tree||!m.tree.kids)return false;
  const spot=nearestFree(m.x,m.y);if(!spot)return false;
  const [A,B]=m.tree.kids,el=els.get(m);
  m.v=A.v;m.tree=A;
  if(el){setVars(el,numColor(m.v));drawKnobs(el,m);wobble(el)}
  const n={id:++PID,kind:'block',x:spot.x,y:spot.y,w:1,h:1,v:B.v,tree:B,ice:0};
  lv.pieces.push(n);
  const ne=makePieceEl(n);
  ne.animate([{transform:`translate(${(m.x-n.x)*cell}px,${(m.y-n.y)*cell}px) scale(.6)`,opacity:.3},{transform:'translate(0,0) scale(1)',opacity:1}],{duration:reduce?80:340,easing:'cubic-bezier(.3,1.4,.5,1)'});
  popSound();buzz(12);
  pickups(n);
  return true;
}
function win(){
  winning=true;clearHint();clearTimeout(deadT);
  const idx=(level-1)%PER,stepDone=idx===PER-1;
  const dot=dotsEl.children[idx];
  if(dot){dot.classList.remove('now');dot.classList.add('on','pop')}
  level++;store.set(lvlKey(mode),level);
  setTimeout(()=>{lvnum.textContent=level;lvnum.classList.remove('pop');void lvnum.offsetWidth;lvnum.classList.add('pop')},350);
  setTimeout(()=>{
    chime();buzz(20);
    if(stepDone)setTimeout(chime,600);
    const ch=document.createElement('div');ch.className='cheer';
    const sz=Math.min(64,Math.max(34,cell*.5));
    lv.gates.forEach((g,i)=>{const k=document.createElement('i');setVars(k,g.value!==undefined?numColor(g.value):COLORS[g.color]);k.style.width=k.style.height=sz+'px';k.style.animationDelay=i*.1+'s';ch.appendChild(k)});
    stage.appendChild(ch);
    tray.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.94)'}],{duration:400,fill:'forwards'});
    setTimeout(()=>{ch.remove();newLevel(true)},reduce?900:1900);
  },180);
}
function newLevel(fade){
  winning=false;exitCount=0;clearTimeout(deadT);
  const t=tierOf(level);
  lv=mode==='math'?genMath(t):genColor(t);
  tray.getAnimations().forEach(a=>a.cancel());
  render();drawDots();
  if(fade)tray.animate([{opacity:0,transform:'scale(.95)'},{opacity:1,transform:'scale(1)'}],{duration:reduce?150:520,easing:'cubic-bezier(.2,.8,.3,1)'});
  armHint();
}

/* gentle hint after a quiet stretch */
let hintT=null;
function clearHint(){clearTimeout(hintT)}
function findHint(){
  const blocks=lv.pieces.filter(p=>p.kind==='block'&&!p.ice);
  if(isMath()){
    for(const p of shuffle(blocks.slice())){const g=gateOf(lv,p);if(g&&!g.locked&&exitOK(p))return ()=>nudge(els.get(p),g.side,cell*.09)}
    for(const a of shuffle(blocks.slice()))for(const b of blocks){
      if(a===b)continue;const s=a.v+b.v;if(s>lv.maxV||s<lv.minV)continue;
      const vals=blockVals([a,b]);if(s!==0)vals.push(s);
      if(solvable(vals,lv.G,lv.maxV,lv.minV))return ()=>nudge(els.get(a),dirToward(a,b),cell*.1);
    }
  }else{
    for(const p of shuffle(blocks.slice())){
      if(p.color<0)continue;
      const g=gateOf(lv,p);if(!g||g.locked)continue;
      if(reach(lv,p).some(([x,y])=>{const t={x,y,w:p.w,h:p.h};return touches(lv,t,g.side)&&fits(t,g)}))return ()=>nudge(els.get(p),g.side,cell*.09);
    }
    const gray=blocks.find(p=>p.color<0);
    if(gray&&lv.pots.length)return ()=>nudge(els.get(gray),dirToward(gray,lv.pots[0]),cell*.09);
  }
  if(keyEl)return ()=>keyEl&&keyEl.animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:500});
  const iced=lv.pieces.find(p=>p.ice);
  if(iced)return ()=>wobble(els.get(iced));
  return null;
}
function armHint(){
  clearHint();
  hintT=setTimeout(()=>{
    if(winning||!lv)return;
    const h=findHint();if(h)h();
    armHint();
  },8000);
}

/* ----- input: drag a piece to any free square it can reach, or tap it ----- */
function tryStep(s,axis,sign){
  const p=s.p,nx=p.x+(axis==='x'?sign:0),ny=p.y+(axis==='y'?sign:0);
  const out=nx<0||ny<0||nx+p.w>lv.W||ny+p.h>lv.H;
  if(out){
    const side=axis==='x'?(sign>0?'right':'left'):(sign>0?'bottom':'top');
    const g=lv.gates.find(x=>x.side===side&&matches(lv,p,x));
    if(g&&fits(p,g)&&!g.locked&&exitOK(p)){s.exited=true;exitBlock(p,s.el,g);return true}
    if(s.bumped!==side){
      s.bumped=side;nudge(s.el,side,cell*.07);if(g&&g.locked)shakeLock(g);bump();buzz(6);
      const g0=lv.gates.find(x=>x.side===side);
      if(g0)whyNoExit(p,g0);
    }
    return false;
  }
  const occ=occMap(lv,p);
  if(!freeFor(lv,occ,nx,ny,p.w,p.h)){
    const k=axis+sign;
    const other=occ.get(K(nx,ny));
    if(other&&p.w===1&&p.h===1&&canMerge(p,other)){s.exited=true;merge(p,other,s.el);return true}
    if(s.bumped!==k){
      s.bumped=k;bump();if(other)wobble(els.get(other));
      if(other&&isMath()&&p.kind==='block'&&other.kind==='block')whyNoMerge(p,other);
    }
    return false;
  }
  p.x=nx;p.y=ny;s.bumped=null;place(s.el,p);tone(440,0,.05,'triangle',.12);
  pickups(p);
  return true;
}
function follow(s,e){
  const fx=(e.clientX-s.px)/cell,fy=(e.clientY-s.py)/cell;
  if(!s.moved&&Math.hypot(fx,fy)>.28){s.moved=true;clearTimeout(s.lp)}
  if(!s.moved)return;
  const p=s.p;
  if(p.ice){if(!s.iceNudged){s.iceNudged=true;refuse(s.el);why(p,'Tap the ice to crack it.','tap the ice')}return}
  const tx=Math.max(-1,Math.min(lv.W-p.w+1,s.bx+Math.round(fx)));
  const ty=Math.max(-1,Math.min(lv.H-p.h+1,s.by+Math.round(fy)));
  for(let i=0;i<40&&!s.exited;i++){
    const dx=tx-p.x,dy=ty-p.y;
    if(!dx&&!dy)break;
    const order=Math.abs(dx)>=Math.abs(dy)?['x','y']:['y','x'];
    let moved=false;
    for(const ax of order){
      const d=ax==='x'?dx:dy;
      if(d&&tryStep(s,ax,Math.sign(d))){moved=true;break}
      if(s.exited)return;
    }
    if(!moved)break;
  }
}
function release(){if(start){clearTimeout(start.lp);start.el.classList.remove('held');start=null}}
tray.addEventListener('pointerdown',e=>{
  ensureAudio();armHint();
  const el=e.target.closest('.block');
  if(!el||el.dataset.gone||start)return;
  e.preventDefault();
  const p=el._p;
  start={el,p,px:e.clientX,py:e.clientY,bx:p.x,by:p.y,id:e.pointerId,moved:false,exited:false,bumped:null,iceNudged:false,lp:null};
  el.classList.add('held');
  try{el.setPointerCapture(e.pointerId)}catch(err){}
  if(isMath()&&p.tree&&p.tree.kids&&!p.ice){
    const s=start;
    s.lp=setTimeout(()=>{if(start===s&&!s.moved){s.exited=true;release();splitPiece(p)}},650);
  }
});
tray.addEventListener('pointermove',e=>{
  if(!start||e.pointerId!==start.id||start.exited)return;
  follow(start,e);
  if(start&&start.exited)release();
});
tray.addEventListener('pointerup',e=>{
  if(!start||e.pointerId!==start.id)return;
  const {el,moved,exited}=start;release();
  if(!moved&&!exited)act(el);
});
tray.addEventListener('pointercancel',release);

/* ----- parent controls ----- */
const fsBtn=document.getElementById('fs');
if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled))fsBtn.hidden=true;
fsBtn.addEventListener('click',()=>{
  const d=document,on=d.fullscreenElement||d.webkitFullscreenElement;
  try{
    if(on){const p=(d.exitFullscreen||d.webkitExitFullscreen).call(d);p&&p.catch&&p.catch(()=>{})}
    else{const el=d.documentElement,fn=el.requestFullscreen||el.webkitRequestFullscreen;const p=fn&&fn.call(el);p&&p.catch&&p.catch(()=>{fsBtn.hidden=true})}
  }catch(err){fsBtn.hidden=true}
});
const sndBtn=document.getElementById('snd'),sndSw=document.getElementById('sndSw');
function drawSound(){
  document.getElementById('sndOn').toggleAttribute('hidden',!soundOn);
  document.getElementById('sndOff').toggleAttribute('hidden',soundOn);
  sndBtn.setAttribute('aria-pressed',String(soundOn));
  sndBtn.style.opacity=soundOn?'':'.9';
  sndSw.setAttribute('aria-checked',String(soundOn));
}
function setSound(on){soundOn=on;store.set('lbo.sound',soundOn);drawSound();if(soundOn)tick();else try{speechSynthesis.cancel()}catch(e){}}
sndBtn.addEventListener('click',()=>setSound(!soundOn));
sndSw.addEventListener('click',()=>setSound(!soundOn));
drawSound();
const helpSw=document.getElementById('helpSw');
function drawHelpers(){helpSw.setAttribute('aria-checked',String(helpersOn))}
helpSw.addEventListener('click',()=>{helpersOn=!helpersOn;store.set('lbo.helpers',helpersOn);drawHelpers();if(!helpersOn&&whyEl&&whyEl.isConnected)whyEl.remove()});
drawHelpers();
const mathBtn=document.getElementById('mathBtn');
function drawMode(){mathBtn.classList.toggle('on',mode==='math');mathBtn.setAttribute('aria-pressed',String(mode==='math'))}
function switchMode(m,L){
  mode=m;store.set('lbo.mode',mode);
  level=L||loadLevel(mode);store.set(lvlKey(mode),level);
  drawMode();newLevel(true);
}
mathBtn.addEventListener('click',()=>{
  tick();switchMode(mode==='math'?'color':'math');
  if(mode==='math')say('adding');
});
drawMode();

/* secret parent menu: press and hold the level number */
const panel=document.getElementById('panel'),lvlEl=document.getElementById('lvl');
const lvOut=document.getElementById('lvOut'),lvHint=document.getElementById('lvHint'),lvFeat=document.getElementById('lvFeat'),chipsEl=document.getElementById('chips');
const gColor=document.getElementById('gColor'),gMath=document.getElementById('gMath'),applyBtn=document.getElementById('apply');
let pMode=mode,pLevel=level,lpT=null;
for(let t=1;t<=TIERS;t++){
  const c=document.createElement('button');c.textContent=(t-1)*PER+1;c.dataset.l=(t-1)*PER+1;
  c.addEventListener('click',()=>{pLevel=+c.dataset.l;drawPanel()});
  chipsEl.appendChild(c);
}
function drawPanel(){
  gColor.setAttribute('aria-pressed',String(pMode==='color'));
  gMath.setAttribute('aria-pressed',String(pMode==='math'));
  lvOut.textContent=pLevel;
  const t=tierOf(pLevel),top=pLevel>TIERS*PER;
  lvHint.textContent=top?`Top difficulty (${TIERS} of ${TIERS})`:`Difficulty ${t} of ${TIERS} · puzzle ${(pLevel-1)%PER+1} of ${PER}`;
  [...chipsEl.children].forEach(c=>c.setAttribute('aria-pressed',String(!top&&tierOf(+c.dataset.l)===t)));
  const spec=pMode==='math'?MT[t]:CT[t],intro=pMode==='math'?INTRO_M:INTRO_C;
  const has=Object.keys(intro).filter(k=>spec[k]&&intro[k]<=t).map(k=>NAMES[k]);
  const fresh=Object.keys(intro).filter(k=>intro[k]===t).map(k=>NAMES[k]);
  const nums=pMode==='math'?`Gates ${Math.min(...spec.vals)}–${Math.max(...spec.vals)}. `:'';
  lvFeat.textContent=nums+(has.length?`Can include ${has.join(', ')}.`:'Just blocks.')+(fresh.length?` New here: ${fresh.join(', ')}.`:'');
  applyBtn.textContent=`Play level ${pLevel}`;
}
function openPanel(){pMode=mode;pLevel=level;drawPanel();panel.hidden=false;clearHint()}
gColor.addEventListener('click',()=>{if(pMode!=='color'){pMode='color';pLevel=loadLevel('color')}drawPanel()});
gMath.addEventListener('click',()=>{if(pMode!=='math'){pMode='math';pLevel=loadLevel('math')}drawPanel()});
document.getElementById('lvMinus').addEventListener('click',()=>{pLevel=Math.max(1,pLevel-1);drawPanel()});
document.getElementById('lvPlus').addEventListener('click',()=>{pLevel=Math.min(999,pLevel+1);drawPanel()});
document.getElementById('keep').addEventListener('click',()=>{panel.hidden=true;armHint()});
applyBtn.addEventListener('click',()=>{panel.hidden=true;switchMode(pMode,pLevel)});
lvlEl.addEventListener('pointerdown',()=>{lvlEl.classList.add('pressing');lpT=setTimeout(()=>{lvlEl.classList.remove('pressing');openPanel()},2000)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>lvlEl.addEventListener(ev,()=>{clearTimeout(lpT);lvlEl.classList.remove('pressing')}));

let rT=null;
addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(!winning)render()},120)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ac)wake()});

newLevel(false);
})();
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
